# ============================================
#  可轉債篩選系統 v3 設定檔
#  資料來源：統一證券 CBAS API（盤後自動更新）
# ============================================

# --- Telegram Bot ---
telegram:
  bot_token: "GITHUB_WILL_INJECT"
  chat_id: "GITHUB_WILL_INJECT"

# --- 篩選策略 ---
# 自訂策略（有 OR 條件的）寫在 cb_screener.py 的 CUSTOM_FILTERS
# 簡單 min/max 篩選的寫在這裡的 filters
strategies:

  # ── 可轉債資優生 ──
  # CB市價 103~150 且（股價在轉換價 -20%~+30% 或 CB市價>轉換價值）+ 5日均量>10
  可轉債資優生:
    description: "CB 103~150 且股價接近轉換價或已超過"
    sort:
      by: "溢價率"
      ascending: true

  # ── 突破轉換價 ──
  # CB>轉換價值(溢價<5%) + 股價突破轉換價0~10% + CB成交>150 + 均量>50
  突破轉換價:
    description: "股價剛突破轉換價，CB有量"
    sort:
      by: "溢價率"
      ascending: true

  # ── 領先創高 ──
  # CB 創 20 日新高 + 股票未創高 + CB 放量 1.3x + 5日均量>=20
  # 需要累積 5 天以上 CB 歷史資料才會啟用
  領先創高:
    description: "CB 創新高但股票未創高，疑似主力領先"
    min_history_days: 5
    sort:
      by: "CB放量倍數"
      ascending: false

# --- 輸出 ---
output:
  save_csv: true
  csv_folder: "./output"
