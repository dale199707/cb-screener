# ============================================
#  可轉債篩選系統 v2 設定檔
#  修改後存檔即可，下次執行自動生效
# ============================================

# --- Telegram Bot ---
telegram:
  bot_token: "8274282740:AAE_gA1dEZ7c7TiXPtn9KiyLMgs_wLC_FDw"
  chat_id: "1375749160"

# --- 資料來源 ---
data:
  xls_folder: "./data"
  file_prefix: "CB list "           # 檔名前綴（注意空格）

# --- 篩選策略 ---
# 可以定義多組策略，每組獨立篩選、獨立推播
# 可用欄位：溢折價、債券市價、賣回收益率、CB成交量、
#          流通張數、到期剩餘天數、賣回剩餘天數、轉換價值
strategies:


  # ── 積極型：找套利機會 ──
  # 重點：折價可轉債 + CB有流動性
  積極型:
    description: "折價 CB，有套利空間"
    filters:
      溢折價:
        max: 0.0            # 只要折價的（溢折價 < 0）
      CB成交量:
        min: 1              # CB 要有成交
      流通張數:
        min: 500            # 流通量不能太小
    sort:
      by: "溢折價"
      ascending: true

  

  # ── 全市場掃描 ──
  # 寬鬆條件，看看整體市場狀況
  # 全市場掃描:
  #   description: "寬鬆條件，概覽全市場"
  #   filters:
  #     溢折價:
  #       max: 0.15
  #     債券市價:
  #       max: 115
  #   sort:
  #     by: "溢折價"
  #     ascending: true

# --- 輸出 ---
output:
  max_results: 15          # 每個策略最多顯示幾檔
  save_csv: true
  csv_folder: "./output"
