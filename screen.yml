name: CB Screener

on:
  schedule:
    # UTC 05:25 = 台灣時間 13:25（盤中）
    # 一次觸發，先 prefetch 再等到 14:30 跑 screener
    - cron: '25 5 * * 1-5'
  workflow_dispatch:  # 手動觸發（會直接跑 prefetch + screener）

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inject Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import yaml
          with open('config.yaml') as f:
              c = yaml.safe_load(f)
          import os
          c['telegram']['bot_token'] = os.environ['TELEGRAM_BOT_TOKEN']
          c['telegram']['chat_id'] = os.environ['TELEGRAM_CHAT_ID']
          with open('config.yaml', 'w') as f:
              yaml.dump(c, f, allow_unicode=True)
          "

      # Step 1: 盤中抓可轉債報價（13:25）
      - name: Run prefetch (盤中抓 CB 報價)
        run: python3 cb_prefetch.py

      # Step 2: 把歷史成交量 commit 回 repo
      - name: Commit history data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/cb_history/ -f
          git diff --cached --quiet || git commit -m "CB歷史成交量 $(TZ=Asia/Taipei date +%Y%m%d)"
          git push || echo "Nothing to push"

      # Step 3: 等到 14:30（台灣時間）再跑 screener
      - name: Wait until 14:30 TW time
        run: |
          TARGET_EPOCH=$(TZ=Asia/Taipei date -d "today 14:30" +%s 2>/dev/null || \
                         python3 -c "
          from datetime import datetime, timezone, timedelta
          tw = timezone(timedelta(hours=8))
          now = datetime.now(tw)
          target = now.replace(hour=14, minute=30, second=0, microsecond=0)
          if target <= now:
              target = now  # 已過 14:30 就不等了
          print(int(target.timestamp()))
          ")
          NOW_EPOCH=$(date +%s)
          WAIT=$((TARGET_EPOCH - NOW_EPOCH))
          if [ "$WAIT" -gt 0 ] && [ "$WAIT" -lt 7200 ]; then
            echo "等待 ${WAIT} 秒（到台灣時間 14:30）..."
            sleep $WAIT
          else
            echo "已過 14:30 或等待時間異常（${WAIT}s），直接執行"
          fi

      # Step 4: 盤後跑篩選 + 推播
      - name: Run screener (盤後篩選)
        run: python3 cb_screener.py
