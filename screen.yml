name: CB Screener

on:
  schedule:
    # UTC 10:30 = 台灣時間 18:30（CBAS API 約 18:00 更新完）
    # 週日～四跑，對應隔天交易日（週一～五）
    - cron: '30 10 * * 0-4'
  workflow_dispatch:  # 手動觸發

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inject Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import yaml
          with open('config.yaml') as f:
              c = yaml.safe_load(f)
          import os
          c['telegram']['bot_token'] = os.environ['TELEGRAM_BOT_TOKEN']
          c['telegram']['chat_id'] = os.environ['TELEGRAM_CHAT_ID']
          with open('config.yaml', 'w') as f:
              yaml.dump(c, f, allow_unicode=True)
          "

      - name: Run screener
        run: python3 cb_screener.py

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/ -f
          git diff --cached --quiet || git commit -m "更新篩選紀錄 $(TZ=Asia/Taipei date +%Y%m%d)"
          git push || echo "Nothing to push"
