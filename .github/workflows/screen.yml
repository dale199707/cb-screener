name: CB Screener

on:
  schedule:
    # UTC 10:30 = 台灣時間 18:30（CBAS API 約 18:00 更新完）
    # 週日～四跑，對應隔天交易日（週一～五）
    - cron: '30 10 * * 0-4'
  workflow_dispatch:  # 手動觸發

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inject Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import yaml
          with open('config.yaml') as f:
              c = yaml.safe_load(f)
          import os
          c['telegram']['bot_token'] = os.environ['TELEGRAM_BOT_TOKEN']
          c['telegram']['chat_id'] = os.environ['TELEGRAM_CHAT_ID']
          with open('config.yaml', 'w') as f:
              yaml.dump(c, f, allow_unicode=True)
          "

      - name: Run screener
        run: python3 cb_screener.py

      # ── 新聞整理（只在 2026-04-22 之後啟用）──
      # 到 4/22 再解開 if 條件，先留著工作流程但條件永遠 false
      - name: Generate news summaries
        if: ${{ vars.ENABLE_NEWS_GENERATOR == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 news_generator.py

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/ -f
          git diff --cached --quiet || git commit -m "更新篩選紀錄 $(TZ=Asia/Taipei date +%Y%m%d)"
          git push || echo "Nothing to push"

      - name: Push data to cb-dashboard
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          if [ -z "$DASHBOARD_TOKEN" ]; then
            echo "DASHBOARD_TOKEN not set, skipping dashboard push"
            exit 0
          fi
          # Clone dashboard repo
          git clone https://x-access-token:${DASHBOARD_TOKEN}@github.com/dale199707/cb-dashboard.git /tmp/dashboard
          # Copy latest.json and daily data
          mkdir -p /tmp/dashboard/data
          cp history/latest.json /tmp/dashboard/data/ 2>/dev/null || true
          mkdir -p /tmp/dashboard/data/daily
          cp history/daily/*.json /tmp/dashboard/data/daily/ 2>/dev/null || true
          # Copy news HTML pages (如果有)
          if [ -d "news_out" ]; then
            mkdir -p /tmp/dashboard/news
            cp news_out/*.html /tmp/dashboard/news/ 2>/dev/null || true
          fi
          # Push
          cd /tmp/dashboard
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ news/ -f 2>/dev/null || git add data/ -f
          git diff --cached --quiet || git commit -m "更新資料 $(TZ=Asia/Taipei date +%Y%m%d)"
          git push || echo "Nothing to push"
