name: CB Screener

on:
  schedule:
    - cron: '25 5 * * 1-5'
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inject Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import yaml
          with open('config.yaml') as f:
              c = yaml.safe_load(f)
          import os
          c['telegram']['bot_token'] = os.environ['TELEGRAM_BOT_TOKEN']
          c['telegram']['chat_id'] = os.environ['TELEGRAM_CHAT_ID']
          with open('config.yaml', 'w') as f:
              yaml.dump(c, f, allow_unicode=True)
          "

      - name: Determine task
        id: task
        run: |
          TW_HOUR=$(TZ=Asia/Taipei date +%H)
          if [ "$TW_HOUR" -lt 14 ]; then
            echo "task=prefetch" >> $GITHUB_OUTPUT
          else
            echo "task=screener" >> $GITHUB_OUTPUT
          fi

      - name: Run prefetch
        if: steps.task.outputs.task == 'prefetch'
        run: python3 cb_prefetch.py

      - name: Run screener
        if: steps.task.outputs.task == 'screener'
        run: python3 cb_screener.py

      - name: Save prefetch
        if: steps.task.outputs.task == 'prefetch'
        uses: actions/upload-artifact@v4
        with:
          name: prefetch-data
          path: output/cb_prefetch.json
          retention-days: 1

      - name: Load prefetch
        if: steps.task.outputs.task == 'screener'
        uses: actions/download-artifact@v4
        with:
          name: prefetch-data
          path: output/
        continue-on-error: true
