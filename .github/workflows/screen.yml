name: CB Screener

on:
  schedule:
    # UTC 10:30 = 台灣時間 18:30。
    # 刻意於週日～四發布，供隔日（週一～五）盤前查看；
    # 程式會依 CBAS create_date 去重，週日沿用星期五資料時不會多算一個交易日。
    - cron: '30 10 * * 0-4'
  workflow_dispatch:  # 手動觸發

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Run screener
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python3 cb_screener.py

      # ── 新聞整理（只在 ENABLE_NEWS_GENERATOR=true 時啟用）──
      - name: Generate news summaries
        if: ${{ vars.ENABLE_NEWS_GENERATOR == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python3 news_generator.py

      # ── Commit history（push 失敗會讓 workflow 變紅，不再偽裝成功）──
      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/ -f
          if [ -d "news_out" ]; then
            git add news_out/ -f
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "更新篩選紀錄 $(TZ=Asia/Taipei date +%Y%m%d)"
            # push 前先 pull --rebase 避免 race condition
            git pull --rebase origin main || true
            git push
          fi

      # ── Push to cb-dashboard（同樣讓失敗能被察覺）──
      - name: Push data to cb-dashboard
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          if [ -z "$DASHBOARD_TOKEN" ]; then
            echo "::error::DASHBOARD_TOKEN not set"
            exit 1
          fi
          # Clone dashboard repo
          git clone https://x-access-token:${DASHBOARD_TOKEN}@github.com/dale199707/cb-dashboard.git /tmp/dashboard
          # Copy latest.json and daily data
          mkdir -p /tmp/dashboard/data
          cp history/latest.json /tmp/dashboard/data/ 2>/dev/null || true
          mkdir -p /tmp/dashboard/data/daily
          cp history/daily/*.json /tmp/dashboard/data/daily/ 2>/dev/null || true
          # Copy news HTML pages (如果有)
          if [ -d "news_out" ]; then
            mkdir -p /tmp/dashboard/news
            cp news_out/*.html /tmp/dashboard/news/ 2>/dev/null || true
          fi
          # Push
          cd /tmp/dashboard
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ news/ -f 2>/dev/null || git add data/ -f
          if git diff --cached --quiet; then
            echo "Nothing to push to dashboard"
          else
            git commit -m "更新資料 $(TZ=Asia/Taipei date +%Y%m%d)"
            git push
          fi
